<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="MIKAZOART Art Gallery — an archive of illustrations, digital artwork, character art, anime artwork, concept art and wallpapers."
    >

    <title>MIKAZOART — Art Gallery</title>

    <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gallery.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="nav-dark">
        <nav>
            <a href="index.html" class="brand-logo" aria-label="MIKAZOART">

                <span class="logo-letter">M</span>
                <span class="logo-letter">I</span>
                <span class="logo-letter">K</span>
                <span class="logo-letter">A</span>
                <span class="logo-letter">Z</span>

                <!-- O = BLOOMING SAKURA -->
                <svg
                    class="logo-sakura"
                    viewBox="0 0 160 160"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <defs>
                        <linearGradient id="petalMain2" x1="20%" y1="10%" x2="80%" y2="100%">
                            <stop offset="0%" stop-color="#fffdfd"/>
                            <stop offset="22%" stop-color="#ffe9f2"/>
                            <stop offset="52%" stop-color="#f8bfd5"/>
                            <stop offset="78%" stop-color="#e58eaf"/>
                            <stop offset="100%" stop-color="#c9638b"/>
                        </linearGradient>
                        <radialGradient id="flowerCenter2">
                            <stop offset="0%" stop-color="#fff9b5"/>
                            <stop offset="40%" stop-color="#ffd966"/>
                            <stop offset="75%" stop-color="#efa93f"/>
                            <stop offset="100%" stop-color="#c97a2c"/>
                        </radialGradient>
                        <filter id="flowerShadow2" x="-40%" y="-40%" width="180%" height="180%">
                            <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#7d3558" flood-opacity="0.30"/>
                        </filter>
                        <filter id="flowerGlow2" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="4"/>
                        </filter>
                    </defs>

                    <circle cx="80" cy="80" r="54" fill="#f5a8c7" opacity="0.16" filter="url(#flowerGlow2)"/>

                    <path d="M80 78 C66 67 59 48 64 34 C68 22 80 18 88 26 C96 34 94 51 84 66 C82 70 81 75 80 78 Z"
                        fill="url(#petalMain2)" stroke="#c8668d" stroke-width="2" filter="url(#flowerShadow2)"/>
                    <path d="M84 76 C96 63 113 57 124 64 C134 70 134 82 125 89 C115 96 99 91 87 83 C84 81 82 79 84 76 Z"
                        fill="url(#petalMain2)" stroke="#c8668d" stroke-width="2" filter="url(#flowerShadow2)"/>
                    <path d="M85 83 C101 86 116 97 116 110 C116 122 106 130 96 125 C85 120 80 104 81 90 C81 86 82 84 85 83 Z"
                        fill="url(#petalMain2)" stroke="#c8668d" stroke-width="2" filter="url(#flowerShadow2)"/>
                    <path d="M76 86 C76 101 69 117 57 121 C46 125 37 117 39 106 C41 94 55 84 69 81 C73 80 75 82 76 86 Z"
                        fill="url(#petalMain2)" stroke="#c8668d" stroke-width="2" filter="url(#flowerShadow2)"/>
                    <path d="M72 79 C58 86 41 84 34 74 C27 64 32 52 43 48 C54 44 67 54 76 68 C78 72 77 76 72 79 Z"
                        fill="url(#petalMain2)" stroke="#c8668d" stroke-width="2" filter="url(#flowerShadow2)"/>

                    <g fill="none" stroke="#d8789d" stroke-width="1.4" opacity="0.55" stroke-linecap="round">
                        <path d="M80 72 C77 56 77 43 79 32"/>
                        <path d="M88 78 C101 72 112 69 122 69"/>
                        <path d="M87 88 C98 96 105 106 108 116"/>
                        <path d="M70 88 C60 96 52 105 47 114"/>
                        <path d="M68 76 C55 69 45 62 38 56"/>
                    </g>

                    <circle cx="79" cy="80" r="13" fill="url(#flowerCenter2)" stroke="#c47a31" stroke-width="1.8"/>

                    <g stroke="#c17b31" stroke-width="1.6" stroke-linecap="round">
                        <line x1="79" y1="80" x2="79" y2="63"/>
                        <line x1="79" y1="80" x2="93" y2="69"/>
                        <line x1="79" y1="80" x2="96" y2="82"/>
                        <line x1="79" y1="80" x2="91" y2="94"/>
                        <line x1="79" y1="80" x2="81" y2="98"/>
                        <line x1="79" y1="80" x2="66" y2="94"/>
                        <line x1="79" y1="80" x2="62" y2="82"/>
                        <line x1="79" y1="80" x2="66" y2="68"/>
                    </g>

                    <g fill="#fff3a3">
                        <circle cx="79" cy="63" r="2.7"/>
                        <circle cx="93" cy="69" r="2.7"/>
                        <circle cx="96" cy="82" r="2.7"/>
                        <circle cx="91" cy="94" r="2.7"/>
                        <circle cx="81" cy="98" r="2.7"/>
                        <circle cx="66" cy="94" r="2.7"/>
                        <circle cx="62" cy="82" r="2.7"/>
                        <circle cx="66" cy="68" r="2.7"/>
                    </g>

                    <circle cx="75" cy="75" r="3" fill="#fff9d0" opacity="0.9"/>
                </svg>

                <span class="logo-letter">A</span>
                <span class="logo-letter">R</span>
                <span class="logo-letter">T</span>

            </a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#about">About</a>
                <a href="gallery.html" class="is-active">Gallery</a>
                <a href="index.html#contact">Contact</a>
                <a href="index.html#explore">Explore My World</a>
            </div>
        </nav>
    </header>


    <!-- =========================
         GALLERY HERO
    ========================== -->
    <main>

        <section class="gallery-hero gallery-art-showcase">

    <div class="gallery-art-background"></div>

    <div class="gallery-art-overlay"></div>

    <div class="gallery-art-content">

        <div class="gallery-art-info">

            <span
                class="gallery-art-category"
                aria-live="polite"
            >
                Illustration
            </span>

            <h1
                class="gallery-art-title"
                aria-live="polite"
            >
                Artwork
            </h1>

        </div>

        <div class="gallery-art-description">

            <p aria-live="polite">
                Artwork description
            </p>

        </div>

    </div>

    <button
        type="button"
        class="gallery-art-click"
        aria-label="Open current artwork"
    ></button>

</section>


        <!-- =========================
             GALLERY
        ========================== -->
        <section class="gallery-section">

            <!-- CATEGORY FILTER -->
            <div class="gallery-filters">

                <button
                    type="button"
                    class="gallery-filter active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="gallery-filter"
                    data-filter="illustration"
                >
                    Illustration
                </button>

                <button
                    type="button"
                    class="gallery-filter"
                    data-filter="digital-artwork"
                >
                    Digital Artwork
                </button>

                <button
                    type="button"
                    class="gallery-filter"
                    data-filter="character-art"
                >
                    Character Art
                </button>

                <button
                    type="button"
                    class="gallery-filter"
                    data-filter="anime"
                >
                    Anime
                </button>

                <button
                    type="button"
                    class="gallery-filter"
                    data-filter="concept-art"
                >
                    Concept Art
                </button>

                <button
                    type="button"
                    class="gallery-filter"
                    data-filter="wallpaper"
                >
                    Wallpaper
                </button>

            </div>


            <!-- =========================
                 TWO MAIN PANELS
            ========================== -->
            <div class="gallery-panels">


                <!-- =========================
                     PROJECT PANEL
                ========================== -->
                <aside class="gallery-project-panel">

                    <div class="panel-heading">

                        <div class="panel-heading-icon">
                            <i class="fa-solid fa-palette"></i>
                        </div>

                        <div>
                            <span class="panel-eyebrow">
                                THE PROJECT
                            </span>

                            <h2>
                                Album &amp; EP
                            </h2>
                        </div>

                    </div>


                    <div
                        id="project-list"
                        class="project-list"
                    >
                        <!-- Project cards generated by gallery.js -->
                    </div>

                </aside>


                <!-- =========================
                     ARTWORK COLLECTION
                ========================== -->
                <section class="gallery-artwork-panel">

                    <div class="artwork-panel-header">

                        <div>
                            <span class="panel-eyebrow">
                                ARTWORK COLLECTION
                            </span>

                            <h2>
                                Selected Works
                            </h2>
                        </div>

                        <span
                            id="artwork-count"
                            class="artwork-count"
                        >
                            0 works
                        </span>

                    </div>


                    <div
                        id="artwork-grid"
                        class="artwork-grid"
                    >
                        <!-- Artwork cards generated by gallery.js -->
                    </div>


                    <div class="load-more-wrapper">

                        <button
                            type="button"
                            id="load-more"
                            class="load-more-button"
                        >
                            Load More
                        </button>

                    </div>

                </section>

            </div>

        </section>

    </main>


    <!-- =========================
         LIGHTBOX
    ========================== -->
    <div
        id="gallery-lightbox"
        class="gallery-lightbox"
        aria-hidden="true"
    >

        <div
            class="gallery-lightbox-backdrop"
            data-close-lightbox
        ></div>

        <div class="gallery-lightbox-content">

            <button
                type="button"
                class="gallery-lightbox-close"
                id="lightbox-close"
                aria-label="Close artwork preview"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="gallery-lightbox-image-wrapper">

                <img
                    id="lightbox-image"
                    src=""
                    alt=""
                >

            </div>

            <div class="gallery-lightbox-info">

                <span id="lightbox-category">
                    Artwork
                </span>

                <h3 id="lightbox-title">
                    Artwork Title
                </h3>

                <span id="lightbox-collection"></span>

            </div>

        </div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer>

        <div class="footer-content">

            <div class="footer-brand">
                <h3>MIKAZOART</h3>

                <p>
                    Digital artwork, imagination and visual storytelling.
                </p>
            </div>


            <div class="footer-social">

                <a
                    href="https://www.instagram.com/mikazo.art/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                >
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a
                    href="https://www.artstation.com/mikazoart9"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="ArtStation"
                >
                    <i class="fa-brands fa-artstation"></i>
                </a>

                <a
                    href="https://pt.pinterest.com/mikazoart/_created/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Pinterest"
                >
                    <i class="fa-brands fa-pinterest-p"></i>
                </a>

                <a
                    href="https://www.deviantart.com/mikazoart"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="DeviantArt"
                >
                    <i class="fa-brands fa-deviantart"></i>
                </a>

                <a
                    href="https://www.pixiv.net/en/users/86367097"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Pixiv"
                >
                    <i class="fa-solid fa-image"></i>
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                &copy; <span id="gallery-year"></span> MIKAZOART.
                All rights reserved.
            </p>

        </div>

    </footer>

        <script src="artworks.js"></script>
        <script src="gallery.js"></script>

</body>
</html>
